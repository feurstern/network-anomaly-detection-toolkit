[project]
name = "network-anomaly-toolkit"
version = "0.1.0"
description = "Reproducible, explainable anomaly detection for infrastructure metrics and network flows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "feurstern" }]
maintainers = [{ name = "feurstern" }]
requires-python = ">=3.12"
keywords = ["anomaly-detection", "observability", "sre", "network-flows", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "threadpoolctl>=3.6",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# Optional autoencoder detector. CPU-only builds come from the PyTorch index configured below.
torch = ["torch>=2.15"]

[project.urls]
Author = "https://github.com/feurstern"

[project.scripts]
network-anomaly = "network_anomaly.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "network_anomaly"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
# CPU-only PyTorch wheels (no CUDA libraries); used only for the `torch` extra.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "PTH",  # prefer pathlib
    "RUF",  # ruff-specific
    "NPY",  # NumPy rules (NPY002 bans the legacy global random state)
    "PD",   # pandas-vet
    "DTZ",  # bans timezone-naive datetime construction
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "threadpoolctl.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
    "integration: end-to-end tests that exercise the CLI",
]
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
source = ["network_anomaly"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
